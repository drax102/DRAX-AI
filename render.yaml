services:
  - type: web
    name: drax-cloud-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn cloud.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DRAX_ENV
        value: production
      - key: CORS_ORIGINS
        value: "*"
